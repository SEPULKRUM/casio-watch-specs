name: Casio Watch Specs Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run collector
        run: python collector.py

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: casio-review-candidates
          path: review_candidates.json
