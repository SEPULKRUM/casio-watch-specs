name: Validate specification imports
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check beta browser logic and package static assets
        run: |
          for test in tests/*.test.mjs; do node "$test"; done
          node --check web/app.mjs
          python build_web.py
      - name: Check reproducible catalog, CSV and coverage
        run: python catalog.py build --check
      - name: Build separate proposal artifact
        run: python specs.py build imports/*.json --output build/catalog.json
      - uses: actions/upload-artifact@v4
        with:
          name: casio-catalog-proposal
          path: |
            data/catalog.json
            data/watches.csv
            data/coverage.json
            data/parts-links.json
            data/search-index.json
            data/reconciliation-report.json
            data/unified-models.csv
