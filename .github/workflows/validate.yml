name: Validate specification imports
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Check reproducible catalog, CSV and coverage
        run: python catalog.py build --check
      - name: Build separate proposal artifact
        run: python specs.py build imports/*.json --output build/catalog.json
      - uses: actions/upload-artifact@v4
        with:
          name: casio-catalog-proposal
          path: |
            data/catalog.json
            data/watches.csv
            data/coverage.json
