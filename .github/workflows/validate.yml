name: Validate specification imports
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python specs.py build imports/*.json --output build/catalog.json
      - uses: actions/upload-artifact@v4
        with:
          name: casio-catalog-proposal
          path: build/catalog.json
