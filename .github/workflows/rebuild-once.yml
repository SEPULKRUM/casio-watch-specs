name: One-time validated Shriro rebuild

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ hashFiles('.rebuild-request') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild committed datasets
        run: python catalog.py build
      - name: Validate Python suite
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript suite
        run: |
          for test_file in tests/*.test.mjs; do
            node "$test_file"
          done
      - name: Confirm deterministic rebuild
        run: python catalog.py build --check
      - name: Commit validated outputs and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .rebuild-request .github/workflows/rebuild-once.yml
          git add data/
          git commit -m "Rebuild datasets for archived Shriro evidence"
          git push
